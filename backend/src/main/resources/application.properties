# =====================================================
#  CalSoft - Backend (Spring Boot)
# =====================================================
spring.application.name=calsoft
# 8081 para no chocar con un Tomcat de NetBeans que use el 8080
server.port=${PORT:8081}

# --- Base de datos PostgreSQL ---
# Para tu clave real crea el archivo "application-local.properties" en la
# carpeta backend (copia application-local.properties.example). Ese archivo
# NO se sube a git. También sirven las variables de entorno DB_HOST, DB_PORT,
# DB_NAME, DB_USER y DB_PASSWORD.
spring.config.import=optional:file:application-local.properties
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:restaurante}
db.user=${DB_USER:postgres}
db.password=${DB_PASSWORD:postgres}

spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}

# El esquema lo aplica la propia app (schema.sql) al arrancar: Hibernate no crea tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad (JWT) ---
# Cámbialo por una cadena larga y aleatoria en producción (mínimo 32 caracteres).
calsoft.jwt.secreto=${JWT_SECRET:calsoft-dev-secreto-cambiar-en-produccion-2026}
calsoft.jwt.horas=8

# URL del proveedor simulado (se usa cuando un proveedor no tiene api_url)
calsoft.proveedor-simulado.url=http://localhost:${server.port}/api/proveedor-simulado/ordenes

# Origen del frontend Angular en desarrollo (CORS)
calsoft.cors.origenes=http://localhost:4200

# Respuestas JSON con tildes y ñ correctas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
